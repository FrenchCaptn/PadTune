# Builds PadTune.exe on Windows for each published version (tag v1.0.0, v1.1.0…)
# or on demand (Actions tab > Build PadTune.exe > Run workflow).
name: Build PadTune.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to attach the exe to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Protocol tests
        run: python -m pytest -q tests

      - name: Build the exe
        run: python -m PyInstaller padtune.spec --noconfirm --clean

      - name: Check the exe
        shell: pwsh
        run: |
          Start-Process -FilePath dist\PadTune.exe -ArgumentList '--selftest','selftest.json' -Wait
          Get-Content selftest.json
          $r = Get-Content selftest.json | ConvertFrom-Json
          if (-not $r.ok) { throw "PadTune.exe self-test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: PadTune-windows
          path: dist/PadTune.exe

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PadTune.exe
